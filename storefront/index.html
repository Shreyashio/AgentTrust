<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentTrust - Test Storefront</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      margin: 0 0 0.5rem 0;
      color: #ffffff;
    }
    .header p {
      color: var(--muted);
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    .card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.2rem;
    }
    .price {
      font-size: 1.5rem;
      font-weight: bold;
      color: #60a5fa;
      margin: 0.5rem 0;
    }
    .price:before {
      content: "₹";
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .badge-fresh {
      background: rgba(34, 197, 94, 0.2);
      color: var(--green);
      border: 1px solid var(--green);
    }
    .badge-stale {
      background: rgba(239, 68, 68, 0.2);
      color: var(--red);
      border: 1px solid var(--red);
    }
    .buy-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .buy-btn:hover {
      background: var(--accent-hover);
    }
    .buy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #loading {
      color: var(--muted);
      font-size: 1.1rem;
    }
    .status-msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      background: #334155;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🛒 AgentTrust Test Storefront</h1>
    <p>Select a product to initiate a test purchase via Razorpay</p>
  </div>

  <div id="loading">Loading products from backend...</div>
  <div id="product-grid" class="grid"></div>
  <div id="status" class="status-msg"></div>

  <script>
    const pageLoadTime = Date.now();
    const DEMO_MERCHANT_ID = "demo";
    const params = new URLSearchParams(window.location.search);
    const TOKEN = params.get("token");

    async function apiFetch(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (options.body) headers.set("Content-Type", "application/json");
      if (TOKEN) headers.set("Authorization", "Bearer " + TOKEN);
      const res = await fetch(path, { ...options, headers });
      if (res.status === 401) {
        throw new Error("Session expired or invalid. Open this storefront from your dashboard.");
      }
      return res;
    }

    async function loadProducts() {
      try {
        // With a token, the storefront shows the logged-in merchant's own catalog;
        // without one, it shows the shared "demo" catalog.
        const res = await apiFetch(TOKEN ? "/products" : "/products/demo");
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const products = await res.json();
        document.getElementById("loading").style.display = "none";

        const grid = document.getElementById("product-grid");
        grid.innerHTML = "";

        products.slice(0, 3).forEach(prod => {
          const card = document.createElement("div");
          card.className = "card";

          const isFresh = prod.staleness_status === "fresh";
          const badgeClass = isFresh ? "badge-fresh" : "badge-stale";

          card.innerHTML = `
            <div>
              <span class="badge ${badgeClass}">${prod.staleness_status}</span>
              <h3>${prod.name}</h3>
              <p style="color: var(--muted); margin: 0.25rem 0;">Stock: ${prod.stock_count} units</p>
              <div class="price">${Number(prod.price).toLocaleString('en-IN')}</div>
            </div>
            <button class="buy-btn" id="btn-buy-${prod.id}" onclick="buyProduct(${prod.id}, '${String(prod.name).replace(/'/g, "\\'")}', ${prod.price})" ${prod.stock_count <= 0 ? 'disabled' : ''}>
              ${prod.stock_count > 0 ? 'Buy Now' : 'Out of Stock'}
            </button>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        document.getElementById("loading").innerHTML = "<strong style='color:#ef4444;'>Failed to load products.</strong><br>Ensure the backend server is running on port 8000.";
        console.error(err);
      }
    }

    async function buyProduct(productId, productName, amount) {
      const btn = document.getElementById(`btn-buy-${productId}`);
      if (btn) {
        btn.disabled = true;
        btn.innerText = "Redirecting to Razorpay...";
      }

      const statusEl = document.getElementById("status");
      statusEl.style.display = "block";
      statusEl.innerText = "Generating test payment link...";

      try {
        const body = {
          product_id: productId,
          product_name: productName,
          amount: amount,
          source: "human"
        };
        if (!TOKEN) body.merchant_id = DEMO_MERCHANT_ID;

        const res = await apiFetch("/payments/create-link", {
          method: "POST",
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error("HTTP error " + res.status);

        const data = await res.json();
        if (data.short_url) {
          statusEl.innerText = "Payment link generated! Redirecting...";
          window.location.href = data.short_url;
        } else {
          alert("Failed to generate payment link: " + JSON.stringify(data));
          if (btn) {
            btn.disabled = false;
            btn.innerText = "Buy Now";
          }
        }
      } catch (err) {
        alert("Error connecting to backend server.");
        console.error(err);
        if (btn) {
          btn.disabled = false;
          btn.innerText = "Buy Now";
        }
      }
    }

    window.onload = loadProducts;
  </script>
</body>
</html>
